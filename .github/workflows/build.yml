name: Build Switch NRO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Switch Dependencies
        shell: bash
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_ttf \
            switch-libpng \
            switch-libjpeg-turbo \
            switch-libwebp \
            switch-freetype \
            switch-mesa \
            switch-glad \
            switch-curl \
            switch-mbedtls

      - name: Build NRO
        shell: bash
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v3
        with:
          name: pico8_launcher
          path: build/pico8_launcher.nro
